[project]
name = "cs2-oracle"
version = "0.1.0"
description = "CS2 Market Intelligence — price forecasting and band calibration"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv==1.0.0",
    "pydantic-settings==2.1.0",
    "requests==2.31.0",
    "brotli>=1.1.0",
    "httpx==0.27.2",
    "beautifulsoup4==4.12.2",
    "apscheduler==3.10.4",
    "numpy>=1.24.3,<3",
    "pandas>=2.1.0,<3",
    "scipy>=1.11.3,<2",
    "lightgbm>=4.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "itsdangerous>=2.2.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "optuna>=3.6.0",
    "optuna-integration[lightgbm]>=4.0.0",
    "joblib>=1.3.0",
    "huggingface_hub>=0.24.0",
    "onnxruntime>=1.18.0",
    "transformers>=4.36.0",
]

[project.optional-dependencies]
mlops = [
    "mlflow>=3.0",
    "evidently>=0.5",
]
probabilistic = [
    "ngboost>=0.5",
    "mapie>=0.9",
]
torch = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.11.0",
    "pre-commit>=3.0",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter, not lint)
    "E741",   # ambiguous variable name (common in math-heavy ML code)
    "B905",   # zip without strict= (too noisy for existing code)
    "SIM108", # ternary instead of if/else (readability preference)
    "UP007",  # X | Y union syntax (requires 3.10+ at call sites)
]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/*" = ["E", "W", "F", "I"]
"backend/models/tft/*" = ["F841", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "slow: real-trainer / full-frame tests excluded from the PR fast gate (see docs/changelog/2026-09-15-ci-test-gate.md)",
]

[tool.mypy]
# Gradual adoption (2026-09-15): whole `models/` + `backtest/` gate in CI;
# still-dirty modules are ignored below until fixed. Remove entries as you fix
# them — do not extend the list to new code.
# No python_version pin: the venv's numpy stubs use 3.12+ syntax, and ruff's
# target-version = py311 already guards the language level.
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "models.forecaster",
    "models.scale_model",
    "models.tft.trainer",
    "collectors.data_validation",
    "collectors.pipeline",
    "config",
    "database",
    "db.parquet",
]
ignore_errors = true
