name: Model Diagnostics

# Scores the signal production actually serves.
#
# `price-forecast.yml` sets CV_DIAGNOSTIC_CLASSIFIER=0 because the per-fold
# directional classifier costs 52% of a retrain (re-measured 2026-08-09 under
# fixed rounds; the "32-37%" in older notes was benchmarked under early stopping,
# which collapsed the classifier to ~3 trees). The consequence is that
# `classifier_accuracy` is None on every fold and `served_acc` falls back to the
# q50 sign — so **every DA and rank-IC number in a daily log describes the
# quantile sign, not what production serves.** That gap is why the naive-mid
# question (the q50 loses to -return_1d on rank IC at all four horizons) cannot
# currently be decided: there is no measurement of the served signal to compare
# against.
#
# This job buys that measurement back on a schedule instead of on the daily path.
# It is a MEASUREMENT ONLY and must never become the served model:
#
#   * It does NOT write to the `forecast-models-` Actions cache key — there is a
#     restore step below and deliberately no save step. That is the *only* path
#     by which an artifact reaches production: the daily predict run restores the
#     newest entry under that prefix. Everything this job writes lands on the
#     runner's own checkout and dies with it.
#   * FORECAST_MODEL_DIR is deliberately NOT set. Pointing it at a scratch
#     directory looks safer but is worse: load_models() would then read an empty
#     directory, tuned_params would stay {}, Optuna would re-search, and the job
#     would measure a freshly-tuned model rather than the one production trains.
#   * TRAIN_HORIZONS gives one horizon per matrix job. The artifacts are thrown
#     away, so the partial-artifact merge hazard that makes this decomposition
#     risky in price-forecast.yml does not exist here.
#   * --train-only writes no forecasts.

on:
  schedule:
    # 02:00 UTC Sundays — clear of the daily chain (Aggregator 23:00 -> Forecast
    # -> Backtest) so the two do not contend for a runner or the voted cache.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      horizons:
        description: 'Comma-separated horizons, or "matrix" for one job each'
        required: false
        default: 'matrix'
        type: string
      # The two gated accuracy instruments, so this workflow can run an A/B arm
      # without touching production. Both default OFF, which keeps the Sunday
      # scheduled run the control -- a scheduled event carries no inputs, so the
      # expressions below resolve to '0' there.
      #
      # One dispatch per arm, read against a control dispatch on the SAME commit.
      # Do not compare an arm to a previously stored number: every retrain before
      # 2026-08-09's re-vote (873148b) sits on a different label basis, and the
      # cached hyperparameters differ between runs that restore different caches.
      tier_lead:
        description: 'Arm: add tier_lead_return_1d (expensive->cheap lead-lag)'
        required: false
        default: false
        type: boolean
      cross_sectional_rank:
        description: 'Arm: rank-transform features within each date'
        required: false
        default: false
        type: boolean
      supply_churn:
        description: 'Arm: add supply_churn_* (|Δlisting| band-width, read on interval coverage/width)'
        required: false
        default: false
        type: boolean
      naive_init_score:
        description: 'Arm: boost the q50 from -return_1d (N1)'
        required: false
        default: false
        type: boolean
      feature_native_nan:
        description: 'Arm: leave NaN features for LightGBM native handling (no median impute; deep-review §10.4). Read dollar error + BAND COVERAGE'
        required: false
        default: false
        type: boolean
      # C2. A within-date lambdarank booster trained ALONGSIDE the q50, read
      # through the same rank-IC path on the same folds. Unlike the arms above it
      # needs no paired control: both bars are intra-run and on the CLEAN ANCHOR
      # cohort -- it must beat naive AND the q50's own ordering, both where
      # p/S == 1. Read `lr_rank_ic_edge_vs_naive_tied` and
      # `lr_rank_ic_edge_vs_q50_tied`; PASS needs BOTH > 0. HP mirror the q50's,
      # so a positive needs FORCE_HP_SEARCH=1 to size. Diagnostic only, no serving
      # path consumes it. See
      # docs/specs/2026-08-13-lambdarank-diagnostic-design.md.
      lambdarank:
        description: 'Arm: within-date lambdarank ranker (read lr_rank_ic edges on the CLEAN ANCHOR line)'
        required: false
        default: false
        type: boolean
      # Unlike the three above, this arm changes the LABEL, so its CV rank IC is
      # measured against a different target than the control's and the two may
      # not be differenced. Set `replay_anchors` when running it -- the replay
      # scores both artifacts on one basis, and it is the only readable
      # comparison. See 2026-08-11-the-gap-is-the-anchor-denominator.md.
      label_smoothed_anchor:
        description: 'Arm: label divides by the SERVED smoothed anchor (read via replay only)'
        required: false
        default: false
        type: boolean
      # Arm A of the serving-anchor freshness plan, and the mirror image of the
      # one above: it changes the price predict() QUOTES FROM rather than the
      # label. Training is untouched, so this arm is invisible to every CV number
      # and to meta.json -- it is readable only through the replay step, and only
      # on the DOLLAR ERROR table there. Rank IC cannot referee it: the replay's
      # headline divides both the prediction and the outcome by the served
      # `current_price`, which this arm moves.
      #
      # Read the `deviating` row. On the tied cohort both arms serve an identical
      # price by construction, so a pooled number dilutes the effect with rows
      # that cannot move.
      serve_outlier_gated_anchor:
        description: 'Arm: serve the RAW quote unless it deviates >10% (read on dollar error only)'
        required: false
        default: false
        type: boolean
      # The band's width, and the only arm here that touches neither the
      # features, nor the label, nor the prediction. It moves which realised
      # return `q_hat`'s residual is measured against: the training label
      # (raw anchor quote) or the smoothed anchor `predict` quotes from and the
      # backtest scores in.
      #
      # Read `q_hat` off the "Conformal calibration" line, arm against control
      # on the SAME commit. A q_hat differenced across commits or across fold
      # counts is not a read -- that is exactly what made run 31563209228
      # unusable, where the arm's 103.70/148.80/205.80/316.96 sat against an
      # artifact trained three days earlier on 9 folds rather than 8.
      #
      # Every other number this job prints is arm-invariant by construction:
      # the boosters, the folds and the labels are identical, so a rank IC or
      # DA delta between these two arms is noise in the run, not an effect.
      conformal_served_basis:
        description: 'Arm: calibrate q_hat on the SERVED denominator (read q_hat only)'
        required: false
        default: false
        type: boolean
      # The band divides by `sigma ** beta` instead of `sigma`. Read the
      # `Sigma-tilt audit` line and, in the replay, BAND COVERAGE by sigma
      # stratum -- but the FIRST thing to check is the median half-width ratio
      # against the control, which the offline read predicts at
      # 0.87 / 0.86 / 0.84 / 0.77x at 3/7/14/30d. A ratio far from that means
      # `beta` reached some of the four call sites and not the others, which is
      # the failure mode of this change: `sigma` is ~0.07, so `sigma ** 0.4` is
      # ~5x larger and `q_hat` absorbs the difference, making a mismatched pair
      # wrong by ~5x rather than partially corrected.
      #
      # ⚠️ `q_hat` from this arm is NOT comparable to the control's -- the two are
      # in different units. Compare COVERAGE and WIDTH, never q_hat. `meta.json`
      # carries `conformal_beta` beside `conformal_calibration` so a stored width
      # is self-describing.
      #
      # This arm also settles an open disagreement: whether the tilt fix reaches
      # 14d/30d (-84% / -73% on a 507-588 date walk-forward) or barely does
      # (-26% / -12% on a single held-out CV fold). `fold_beta` is now reported
      # per fold, which is the drift measurement that dispute turns on.
      sigma_exponent:
        description: 'Arm: band divides by sigma**beta (compare WIDTH and coverage, never q_hat)'
        required: false
        default: false
        type: boolean
      # The successor arm, and MUTUALLY EXCLUSIVE with the one above -- setting
      # both raises at the first calibration rather than serving a band that has
      # been corrected twice. `sigma_exponent` damps a hand-picked variable;
      # this replaces it with a small model fitted on the out-of-fold residuals
      # `q_hat` is already calibrated on, so the band's width comes from what
      # the model knows about an item rather than from its 60-day wobble alone.
      #
      # Read it on `BAND COVERAGE BY SIGMA` in the replay, not on the OOF audit:
      # the exponent it replaces looked right out of fold and FLIPPED the tilt's
      # sign at serving (2026-08-12-served-sigma-profile.md), which is the whole
      # reason that table exists. `q_hat` is in the learned scale's units and is
      # not comparable with a control's at all -- compare coverage and WIDTH.
      learned_scale:
        description: 'Arm: band width is learned from features, not sigma (excl. sigma_exponent)'
        required: false
        default: false
        type: boolean
      # The third band-denominator arm, MUTUALLY EXCLUSIVE with the two above.
      # It divides by `sigma * sqrt(p_exceed)`, where `p_exceed` is a per-item
      # binary head's probability the h-day move clears the round-trip cost — a
      # market-orthogonal magnitude signal, never a directional call (invariant 4).
      # Like sigma_exponent/learned_scale it changes BOTH the denominator q_hat is
      # calibrated on and the one `band` multiplies, so the env var must be
      # identical in every step that calibrates or serves. The calibration
      # probability is OUT-OF-FOLD: the CV path fits a per-fold head so the p that
      # scales q_hat never saw the rows it scales.
      #
      # Read BAND COVERAGE BY SIGMA in the replay, arm vs control on the SAME
      # commit and anchors. The offline read predicts the volatile-tail coverage
      # rises (31-44% -> 47-53%) for ~5-15% more median width; `q_hat` is in the
      # scale's units and is NOT comparable with a control's — compare coverage and
      # WIDTH. meta.json carries `exceedance_scale`.
      exceedance_scale:
        description: 'Arm: band divides by sigma*sqrt(p_exceed) (excl. sigma_exponent/learned_scale; compare coverage+WIDTH)'
        required: false
        default: false
        type: boolean
      # Like the three band arms above it redefines BOTH the denominator q_hat is
      # calibrated on and the one `band` multiplies, so the env var must be
      # identical in every step that calibrates or serves. The scale is a per-item
      # h-day return dispersion shrunk toward the price tier — no booster, a
      # persisted lookup table. Offline on the durable archive it is 43-47%
      # NARROWER than sigma at matched 0.80 coverage at every horizon, out of
      # sample (docs/research/2026-08-19-climatology-vs-gbm-band.md). `q_hat` is in
      # the scale's units and NOT comparable with a control's — read BAND COVERAGE
      # and WIDTH on the SERVED panel via replay, arm vs control on the SAME
      # commit/anchors. meta.json carries `climatology_scale`.
      climatology_scale:
        description: 'Arm: band scale is a per-item climatological dispersion (excl. sigma_exponent/learned_scale/exceedance_scale; compare coverage+WIDTH)'
        required: false
        default: false
        type: boolean
      # A MODIFIER of climatology_scale, not a fifth denominator: it multiplies
      # the per-item climatology level by clip(ewm_reactive_fast/ewm_reactive_slow,
      # 0.5, 2.0) — a short/long date-aware EWMA-vol ratio — so the band flexes
      # with how recent vol compares to the item's own recent norm. Has NO effect
      # unless climatology_scale is also on, so dispatch this arm with BOTH set,
      # and its control with climatology_scale ONLY. Matched pair (folded into
      # q_hat at fit), so the env var must be identical in the CV and replay
      # steps. Local calm-anchor A/B (2026-08-20): narrows calm bands ~19% toward
      # the 80% target and ~neutral on volatile anchors. ⚠️ Prod's clean replay
      # anchors are all high-volatility, where this is ~neutral by design — read
      # BAND COVERAGE + WIDTH, and expect the win to show only over calm served
      # dates, not on this job's anchor set. meta.json carries climatology_reactive.
      climatology_reactive:
        description: 'Arm: regime-reactive multiplier ON climatology_scale (set BOTH; compare coverage+WIDTH)'
        required: false
        default: false
        type: boolean
      # A training-ONLY arm, unlike every band arm above: time-decayed sample
      # weights (SAMPLE_WEIGHT_HALFLIFE_DAYS). It touches neither the label, the
      # features, nor calibration -- it reweights the training rows so the recent
      # regime dominates the gradient, and the decay is BAKED INTO the fitted
      # booster, so predict()/the replay read it for free and it needs no env in
      # the replay step and no meta.json field.
      #
      # CV-positive at 30d on the honest trainer (+1.44% q50 pinball, paired
      # -0.108 [-0.192, -0.026], permuted-recency placebo null) -- but that is a
      # BAND/pinball gain, not DA, and the ship bar is served-band coverage.
      # Every band-width lever before it improved OOF and failed to transfer to
      # serving. So set `replay_anchors` and read BAND COVERAGE; a CV number does
      # not settle it. A halflife in days as a string; '0'/'' disables, 365 is
      # the tested value. Note the band OVER-covers today, so the arm helps only
      # if it TIGHTENS coverage toward 80%.
      recency_halflife:
        description: 'Arm: sample-weight halflife in days (0 disables; 365 tested; read BAND COVERAGE in replay)'
        required: false
        default: '0'
        type: string
      # Training-window A/B: how many days back train() fetches (default 1460 =
      # 4 years). Bakes into the artifact this step trains; the replay serves it,
      # so it is set on the CV step only, like recency_halflife. Read BAND
      # COVERAGE + rank IC across arms. 1-year (365) is unreliable at 30d — the
      # 43-day embargo + 200-day feature warmup leave too few folds.
      train_days_back:
        description: 'Arm: training lookback window in days (1460 = 4yr default; try 1095/730/365; read BAND COVERAGE)'
        required: false
        default: '1460'
        type: string
      # The decisive test for the band's over-coverage, and the only arm here
      # that changes how much data the FOLD models see rather than what they
      # see. `CV_MAX_TRAIN_ROWS` defaults to 300,000 (`6b6fc81`, a cost cap),
      # while the shipped model trains on the full 1.2M budget -- so every
      # residual `q_hat` is fitted on comes from a model weaker than the one
      # production serves, which makes the pooled `q_hat` conservative by
      # construction and the band over-cover uniformly. That is the shape the
      # 2026-08-12 panel has.
      #
      # Read `q_hat` off the "Conformal calibration" line, arm against a control
      # dispatch on the SAME commit. The `Expanding-window audit` line's rho is
      # only a screen: with the cap binding, most folds share one `n_train` and
      # there is almost no x-axis left, so a rho near zero there is not evidence
      # against the hypothesis. THIS knob is the read.
      #
      # ⚠️ Cost. The cap exists because nine uncapped expanding windows sum to
      # 4.2x the frame and the conformal-CV phase was 50.4% of an 872s retrain.
      # Raising it scales that phase roughly linearly, so a 1.2M value is a
      # ~30-minute job per horizon and will not fit the working cap. Sweep
      # upward (600000) before reaching for the full budget, and never set it on
      # a path that saves an artifact.
      cv_max_train_rows:
        description: 'Rows per CV fold (default 300000; raise to test the band over-coverage)'
        required: false
        default: ''
        type: string
      # Not an arm -- a confirm mode for one. The first read of every arm above
      # reuses the cached `tuned_params`, which is what makes the arms
      # comparable and is also why their SIZE is provisional: the HP were
      # selected without the arm's feature. Re-tuning costs an Optuna phase
      # (63-693s per horizon, measured) and makes the run non-comparable to a
      # cached-HP one, so it stays off by default and the arm label records it.
      force_hp_search:
        description: 'Confirm mode: re-tune HP instead of reusing the cache (slow)'
        required: false
        default: false
        type: boolean
      # The serving branch of the rank transform cannot be reached from CV --
      # folds are already cohort-filtered, so they take reference_mask=None.
      # This runs predict() after training and writes NOTHING, which is the
      # difference between it and a price-forecast.yml dispatch: that one calls
      # _write_forecasts_to_db under the same model_version production uses.
      predict_smoke:
        description: 'Run predict() after training and write nothing (path check)'
        required: false
        default: false
        type: boolean
      # The serving-path MEASUREMENT, as opposed to predict_smoke's shape check.
      # Comma-separated ISO dates; empty skips the step entirely. Each anchor
      # rewinds the serving clock (REPLAY_ANCHOR), serves the artifact this job
      # just trained, and scores it against outcomes the archive already holds.
      #
      # Only THIS JOB'S horizon is scored. The matrix trains one horizon beside
      # boosters restored from the production cache, and a feature transform
      # applies to the whole frame -- so the other three rows would be boosters
      # fitted on untransformed features being fed transformed ones.
      #
      # Cost: roughly 4 minutes per anchor on top of training, all of it the
      # bounded archive read and a cold vote (the cache key carries the anchor).
      # Two anchors keeps a diagnostics job inside the 30-minute working cap.
      #
      # The replay AUDITS each anchor against its neighbours' collection before
      # it loads the artifact, and refuses a date the archive collected
      # differently -- `audit_anchor_feed` in `scripts/replay_serving.py`. It
      # refuses 12 of the 187 dates of 2026 that have a resolvable h=30, and two
      # of the four anchors used through 2026-08-12 are among them: 2026-07-09
      # (the usual feed absent, a substitute quoting 1.287x) and 2026-04-15 (the
      # last day before the three-source era ends, so every horizon resolves on
      # the feed that replaced it). Do not re-use that set.
      #
      # AND THE FEED AUDIT IS NOT THE WHOLE CHECK (2026-08-13). It looks +/-3 days
      # around the anchor and cannot see a basis change 30 days out, so an anchor
      # can pass it and still resolve its OUTCOME across a cutover -- a synthetic
      # market-wide move scored as a return. `cutovers_in_outcome_window` now
      # drops those horizons and refuses when none survive. It rejects
      # 2026-07-06 beyond h=3 and 2026-06-16 at h=30, so the "clean and
      # comparable" set named here through 2026-08-12 was itself not clean.
      #
      # Clean on BOTH audits at all four horizons, inside one collection regime
      # (~25,010 items/day, after the 2026-04-16 cutover):
      # 2026-04-18,2026-04-28,2026-05-08,2026-05-19,2026-05-29,2026-06-08.
      # 52 such dates exist, all in 2026-04-18..06-08 and all high-volatility --
      # the archive holds ~5,200 items/day before March, so no clean set reaches
      # a calm quarter without crossing a collection regime.
      # docs/changelog/2026-08-12-july-09-anchor-is-a-feed-substitution.md
      # docs/changelog/2026-08-13-the-rescaling-is-a-level-fix-not-a-spread-fix.md
      replay_anchors:
        description: 'Serving replay: comma-separated anchor dates (audited; e.g. 2026-05-16,2026-06-16)'
        required: false
        default: ''
        type: string
      # The two knobs that settle how production should get a correctly centred
      # band (F1, `2026-08-11-conformal-centre-follows-serving.md`). Both are
      # default-as-today, and the values are WORDS on purpose.
      #
      # A default-on flag has no safe numeric spelling here. On a SCHEDULED event
      # every input is absent, and GitHub's loose equality casts to Number before
      # comparing -- so `'' == '0'` is `0 == 0`, TRUE, and a `== '0'` guard would
      # flip the Sunday run to the treatment. Bare `inputs.x || '1'` instead
      # depends on whether the string '0' is truthy, which is the kind of thing
      # that fails silently as a no-op arm read as a control. `== 'q50'` casts to
      # NaN and is false for both absence and 'conformal_centre', so all three
      # branches are correct without relying on either rule.
      #
      # q50 reproduces the DEFECT: no out-of-fold direction call, so q_hat is
      # centred on the q50 mid while predict still recentres. That is the paired
      # control the served-centre read could not produce, because this workflow
      # used to hardcode the classifier on.
      cv_diagnostic_classifier:
        description: 'q_hat centre: served (pays ~932s for the OOF call) or q50 (the defect, as production)'
        required: false
        default: 'served'
        type: choice
        options: ['served', 'q50']
      # Serving transforms to skip inside predict(), comma-separated
      # (blend, bias, recenter). Requires replay_anchors -- the replay refuses
      # REPLAY_DISABLE without an anchor, because disabling a transform on the
      # live path would publish a forecast that is not the product.
      #
      # `recenter` is the cheap alternative to paying for the served centre:
      # with it off the served mid IS the q50 mid, so the q50-centred q_hat is
      # already correct and the band needs no new calibration. What it costs is
      # that the served price can disagree in sign with the served direction
      # label, which is the coherence the recentring was added for.
      replay_disable:
        description: 'Replay only: transforms to skip (blend,bias,recenter)'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      # One horizon per job. 30d is the long pole; the others finish well inside
      # it. fail-fast off so one horizon's failure still yields the other three.
      fail-fast: false
      matrix:
        horizon: [3, 7, 14, 30]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Checkout price archive
        uses: actions/checkout@v7
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Link price-archive
        run: ln -s $PWD/archive/price-archive price-archive

      # Read-only on purpose: restore-only, no matching save step. This job wants
      # the cached hyperparameters (so it measures the model production trains,
      # not a freshly-searched one) but must not write the cache back.
      - name: Restore trained models (read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/models/saved_models
            !backend/models/saved_models/engineered_data.parquet
          key: forecast-models-never-matches-${{ github.run_id }}
          restore-keys: |
            forecast-models-

      - name: Cache voted price frame
        uses: actions/cache@v4
        with:
          path: backend/data
          key: voted-v6-${{ hashFiles('backend/models/forecaster.py') }}
          restore-keys: voted-v6-

      - name: Run CV with the served classifier scored
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
          # The entire point of this workflow -- and since 2026-08-11 it also
          # decides which mid q_hat is centred on, because the served centre
          # needs this classifier's out-of-fold call. `== 'q50'` and not the
          # arms' `inputs.x && '1' || '0'`: this knob is default-ON, and that
          # form resolves to '0' on a scheduled run where inputs are absent.
          # See the input's comment for why the word and not '0'.
          CV_DIAGNOSTIC_CLASSIFIER: ${{ inputs.cv_diagnostic_classifier == 'q50' && '0' || '1' }}
          TRAIN_HORIZONS: ${{ matrix.horizon }}
          ENGINEERED_CACHE: "0"
          # The artifact is discarded, so regime models buy nothing here. Unlike
          # on the serving path, skipping them costs no accuracy — nothing this
          # job produces is predicted from.
          SKIP_REGIMES: "1"
          # Arm selection. '0' on a scheduled run (no inputs), so the Sunday job
          # stays the control. Training reads these from the environment rather
          # than from the restored artifact's meta, deliberately — see
          # ItemForecaster._tier_lead_served — so restoring a control artifact
          # cannot silently turn a treatment arm back into a control.
          #
          # What the restore DOES carry into an arm is `tuned_params`: the
          # hyperparameters were selected without the tier-lead column. That is
          # the intended first read (HP held fixed across arms), not an
          # oversight. Confirm any positive with FORCE_HP_SEARCH=1 before
          # believing the size of it.
          TIER_LEAD_FEATURE: ${{ inputs.tier_lead && '1' || '0' }}
          CROSS_SECTIONAL_RANK: ${{ inputs.cross_sectional_rank && '1' || '0' }}
          # Adds the isolated supply_churn group (|Δlisting| magnitude off the
          # buff_listing_count sidecar). A band-WIDTH arm: read interval coverage
          # and width, not DA. Populated only over the sidecar's 2021-2024 span.
          SUPPLY_CHURN_FEATURES: ${{ inputs.supply_churn && '1' || '0' }}
          # N1. Unlike the two above this changes what the boosters PREDICT (a
          # residual to -return_1d, not a level), so the run logs a warning when
          # it is on with reused HP. Read `rank_ic_edge` per horizon; the bar is
          # >= 0, and it is currently negative at all four.
          NAIVE_INIT_SCORE: ${{ inputs.naive_init_score && '1' || '0' }}
          # Changes what the boosters SEE (NaN vs median-imputed), so it must be
          # set on the training step. Serving follows meta.json's
          # feature_native_nan (matched pair, like naive_init_score); read the
          # effect on dollar error + BAND COVERAGE in the replay step.
          FEATURE_NATIVE_NAN: ${{ inputs.feature_native_nan && '1' || '0' }}
          # C2. Adds a within-date ranker in the CV path; touches no served
          # artifact. Read on the CLEAN ANCHOR line's lr_rank_ic edges.
          LAMBDARANK: ${{ inputs.lambdarank && '1' || '0' }}
          # Changes the LABEL, not the features or the prediction. Every CV
          # number this run prints -- rank IC, the naive bar, DA -- is measured
          # against a different target than the control's, so read this arm
          # through the replay step below and nowhere else.
          LABEL_SMOOTHED_ANCHOR: ${{ inputs.label_smoothed_anchor && '1' || '0' }}
          # Calibration-only: it moves the residual q_hat is fitted on and
          # nothing the boosters see. Read q_hat off the "Conformal calibration"
          # line; every other number here is arm-invariant.
          CONFORMAL_SERVED_BASIS: ${{ inputs.conformal_served_basis && '1' || '0' }}
          # Calibration AND serving: it changes the denominator q_hat is fitted
          # on and the one `band` multiplies, together. That pairing is the whole
          # correctness condition, so this env var must be identical in every
          # step of this job that either calibrates or serves.
          SIGMA_EXPONENT: ${{ inputs.sigma_exponent && '1' || '0' }}
          # Same three steps as SIGMA_EXPONENT and for the same reason:
          # this changes the denominator q_hat is fitted on AND the one
          # the band multiplies, so a step that calibrates or serves
          # without it would pair a learned-scale q_hat with sigma.
          LEARNED_SCALE: ${{ inputs.learned_scale && '1' || '0' }}
          # Same three steps as SIGMA_EXPONENT/LEARNED_SCALE and for the same
          # reason: it changes the denominator q_hat is fitted on AND the one the
          # band multiplies, so a calibrate-or-serve step without it would pair an
          # exceedance-scale q_hat with plain sigma. Also gates whether the CV path
          # computes the out-of-fold exceed_p and whether the production head trains.
          EXCEEDANCE_SCALE: ${{ inputs.exceedance_scale && '1' || '0' }}
          # Same matched-pair discipline: identical in every calibrate/serve step.
          # Serving follows meta.json's climatology_scale, but set it here so a
          # fresh dispatch that has not loaded an artifact still serves the arm.
          CLIMATOLOGY_SCALE: ${{ inputs.climatology_scale && '1' || '0' }}
          # Matched-pair MODIFIER of climatology_scale: folded into q_hat at fit
          # and read from the engineered ewm_reactive_* columns at serve, so it
          # must be identical in the CV and replay steps. No effect unless
          # CLIMATOLOGY_SCALE is on. meta.json carries climatology_reactive.
          CLIMATOLOGY_REACTIVE: ${{ inputs.climatology_reactive && '1' || '0' }}
          # Rows per CV fold. Empty means "do not set it", which is what leaves
          # `ItemForecaster.CV_MAX_TRAIN_ROWS` (300,000) in charge -- an empty
          # env var would be read by `int(os.environ.get(...))` and raise, so the
          # `||` fallback must reproduce the class default rather than ''.
          CV_MAX_TRAIN_ROWS: ${{ inputs.cv_max_train_rows || '300000' }}
          # Training-only recency arm. Read at import as float(... or "0.0"), so
          # the `|| '0'` fallback matters: an empty string would raise. Not set
          # in the replay step -- the decay is already baked into the artifact
          # this step trains, so serving reads it without the env.
          SAMPLE_WEIGHT_HALFLIFE_DAYS: ${{ inputs.recency_halflife || '0' }}
          # Training-window arm. Parsed as int(... or 1460), unparseable keeps
          # 1460. Baked into the artifact, so replay serves it without the env.
          TRAIN_DAYS_BACK: ${{ inputs.train_days_back || '1460' }}
          # Serving-only, so it reaches nothing this step trains. Set here for
          # `predict_smoke`, which is the one mode of this step that calls
          # predict() -- and it writes nothing, so the arm cannot escape.
          SERVE_OUTLIER_GATED_ANCHOR: ${{ inputs.serve_outlier_gated_anchor && '1' || '0' }}
          # Off by default: a re-tuned run cannot be read against a cached-HP
          # one, so leaving this on would break the panel it is meant to confirm.
          FORCE_HP_SEARCH: ${{ inputs.force_hp_search && '1' || '0' }}
        run: |
          set -o pipefail
          MODE=--train-only
          if [ "${{ inputs.predict_smoke }}" = "true" ]; then
            MODE=--predict-smoke
          fi
          python scripts/forecast_prices.py "$MODE" 2>&1 \
            | tee diagnostics-${{ matrix.horizon }}d.log

      # Scores what predict() actually serves. CV never touches it: the
      # prior-day blend, the tier bias, _recenter_on_direction and the conformal
      # band all run inside predict and nowhere else. Writes nothing to the
      # database -- see scripts/replay_serving.py.
      #
      # It serves the artifact the step above just saved, so the arm flags must
      # still be set here: predict refuses a rank-transform artifact whose
      # recorded cohort and skip set do not match what it is asked to apply.
      - name: Replay the serving path
        if: inputs.replay_anchors != ''
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
          TIER_LEAD_FEATURE: ${{ inputs.tier_lead && '1' || '0' }}
          CROSS_SECTIONAL_RANK: ${{ inputs.cross_sectional_rank && '1' || '0' }}
          NAIVE_INIT_SCORE: ${{ inputs.naive_init_score && '1' || '0' }}
          # Serving follows meta.json's feature_native_nan; set here for symmetry
          # so a fresh dispatch that has not loaded an artifact serves the arm.
          FEATURE_NATIVE_NAN: ${{ inputs.feature_native_nan && '1' || '0' }}
          # Carried for provenance only -- the replay builds its own labels from
          # the archive and never calls prepare_targets, so the arm cannot reach
          # the score. That is exactly why it is the referee for this flag.
          LABEL_SMOOTHED_ANCHOR: ${{ inputs.label_smoothed_anchor && '1' || '0' }}
          # Provenance too, and for a stronger reason: calibration already
          # happened in the step above. The replay serves the q_hat this run
          # produced, so its BAND COVERAGE table is where the arm's effect shows
          # up -- but the flag itself does nothing here.
          CONFORMAL_SERVED_BASIS: ${{ inputs.conformal_served_basis && '1' || '0' }}
          # NOT provenance, and not optional either: the replay builds the band,
          # so it must serve the exponent the artifact was calibrated at. It reads
          # `conformal_beta` from meta.json, so this only matters for a path that
          # calibrates in-process -- set for symmetry, and so that a future step
          # that does calibrate cannot inherit a mismatch.
          SIGMA_EXPONENT: ${{ inputs.sigma_exponent && '1' || '0' }}
          # Same three steps as SIGMA_EXPONENT and for the same reason:
          # this changes the denominator q_hat is fitted on AND the one
          # the band multiplies, so a step that calibrates or serves
          # without it would pair a learned-scale q_hat with sigma.
          LEARNED_SCALE: ${{ inputs.learned_scale && '1' || '0' }}
          # NOT provenance: the replay builds the band, so it must serve the same
          # exceedance scale q_hat was calibrated against. band_scale reads the
          # served head and follows meta.json's exceedance_scale, but set it here
          # for symmetry and so a future in-process calibrate cannot mismatch.
          EXCEEDANCE_SCALE: ${{ inputs.exceedance_scale && '1' || '0' }}
          # Same matched-pair discipline: identical in every calibrate/serve step.
          # Serving follows meta.json's climatology_scale, but set it here so a
          # fresh dispatch that has not loaded an artifact still serves the arm.
          CLIMATOLOGY_SCALE: ${{ inputs.climatology_scale && '1' || '0' }}
          # Matched-pair MODIFIER of climatology_scale: folded into q_hat at fit
          # and read from the engineered ewm_reactive_* columns at serve, so it
          # must be identical in the CV and replay steps. No effect unless
          # CLIMATOLOGY_SCALE is on. meta.json carries climatology_reactive.
          CLIMATOLOGY_REACTIVE: ${{ inputs.climatology_reactive && '1' || '0' }}
          # NOT provenance: this is the step the arm acts in. It changes the
          # served `current_price`, which is what the DOLLAR ERROR table below
          # scores -- and what `rankIC` divides by, which is why that column is
          # not readable across arms and `pinnedIC` exists beside it.
          SERVE_OUTLIER_GATED_ANCHOR: ${{ inputs.serve_outlier_gated_anchor && '1' || '0' }}
          # Serving transforms to skip, and the only step that may honour it:
          # REPLAY_DISABLE names things that live inside predict(), so setting it
          # on the training step would report a skip that never happened. Empty
          # is the full serving path. `recenter` is the arm that reads the cheap
          # alternative to a served-centre q_hat -- see the input's comment.
          REPLAY_DISABLE: ${{ inputs.replay_disable }}
        run: |
          set -o pipefail
          # --basis-sweep always: it re-scores mids that predict() already
          # produced, so it costs pandas over an existing frame and no model
          # time, and it carries the tied/deviating split that
          # 2026-08-11-clean-anchor-signal-replicates.md rests on. A replay
          # without it reports the contaminated and clean thirds of the cohort
          # pooled into one number.
          for anchor in $(echo "${{ inputs.replay_anchors }}" | tr ',' ' '); do
            REPLAY_ANCHOR="$anchor" python -m scripts.replay_serving \
              --horizons ${{ matrix.horizon }} --basis-sweep 2>&1 \
              | tee -a replay-${{ matrix.horizon }}d.log
          done

      # The numbers are the deliverable, so they have to outlive the runner.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.horizon }}d
          path: |
            backend/diagnostics-${{ matrix.horizon }}d.log
            backend/replay-${{ matrix.horizon }}d.log
            backend/models/saved_models/meta.json
          retention-days: 90

      - name: Summarise
        if: always()
        working-directory: ./backend
        env:
          TIER_LEAD_FEATURE: ${{ inputs.tier_lead && '1' || '0' }}
          CROSS_SECTIONAL_RANK: ${{ inputs.cross_sectional_rank && '1' || '0' }}
          SUPPLY_CHURN_FEATURES: ${{ inputs.supply_churn && '1' || '0' }}
          NAIVE_INIT_SCORE: ${{ inputs.naive_init_score && '1' || '0' }}
          FEATURE_NATIVE_NAN: ${{ inputs.feature_native_nan && '1' || '0' }}
          LAMBDARANK: ${{ inputs.lambdarank && '1' || '0' }}
          LABEL_SMOOTHED_ANCHOR: ${{ inputs.label_smoothed_anchor && '1' || '0' }}
          CONFORMAL_SERVED_BASIS: ${{ inputs.conformal_served_basis && '1' || '0' }}
          SIGMA_EXPONENT: ${{ inputs.sigma_exponent && '1' || '0' }}
          # Same three steps as SIGMA_EXPONENT and for the same reason:
          # this changes the denominator q_hat is fitted on AND the one
          # the band multiplies, so a step that calibrates or serves
          # without it would pair a learned-scale q_hat with sigma.
          LEARNED_SCALE: ${{ inputs.learned_scale && '1' || '0' }}
          EXCEEDANCE_SCALE: ${{ inputs.exceedance_scale && '1' || '0' }}
          # Same matched-pair discipline: identical in every calibrate/serve step.
          # Serving follows meta.json's climatology_scale, but set it here so a
          # fresh dispatch that has not loaded an artifact still serves the arm.
          CLIMATOLOGY_SCALE: ${{ inputs.climatology_scale && '1' || '0' }}
          # Matched-pair MODIFIER of climatology_scale: folded into q_hat at fit
          # and read from the engineered ewm_reactive_* columns at serve, so it
          # must be identical in the CV and replay steps. No effect unless
          # CLIMATOLOGY_SCALE is on. meta.json carries climatology_reactive.
          CLIMATOLOGY_REACTIVE: ${{ inputs.climatology_reactive && '1' || '0' }}
          SERVE_OUTLIER_GATED_ANCHOR: ${{ inputs.serve_outlier_gated_anchor && '1' || '0' }}
          FORCE_HP_SEARCH: ${{ inputs.force_hp_search && '1' || '0' }}
        run: |
          # The arm goes in the heading. A diagnostics run that cannot say which
          # arm produced it is worse than no run: the numbers look citable and
          # are not. meta.json (uploaded above) carries the same two flags, so
          # the artifact is self-describing even without this summary.
          #
          # if-blocks rather than `[ x ] && y=z`: `defaults.run.shell: bash`
          # means `bash -e`, under which a bare failing test is a failed step.
          arms=""
          if [ "$TIER_LEAD_FEATURE" = "1" ]; then arms="tier_lead"; fi
          if [ "$CROSS_SECTIONAL_RANK" = "1" ]; then
            arms="${arms:+$arms+}xs_rank"
          fi
          if [ "$SUPPLY_CHURN_FEATURES" = "1" ]; then
            arms="${arms:+$arms+}supply_churn"
          fi
          if [ "$NAIVE_INIT_SCORE" = "1" ]; then
            arms="${arms:+$arms+}naive_init"
          fi
          if [ "$LAMBDARANK" = "1" ]; then
            arms="${arms:+$arms+}lambdarank"
          fi
          if [ "$LABEL_SMOOTHED_ANCHOR" = "1" ]; then
            arms="${arms:+$arms+}smoothed_label"
          fi
          if [ "$CONFORMAL_SERVED_BASIS" = "1" ]; then
            arms="${arms:+$arms+}served_basis"
          fi
          if [ "$SIGMA_EXPONENT" = "1" ]; then
            arms="${arms:+$arms+}sigma_exponent"
          fi
          if [ "$LEARNED_SCALE" = "1" ]; then
            arms="${arms:+$arms+}learned_scale"
          fi
          if [ "$EXCEEDANCE_SCALE" = "1" ]; then
            arms="${arms:+$arms+}exceedance_scale"
          fi
          if [ "$CLIMATOLOGY_SCALE" = "1" ]; then
            arms="${arms:+$arms+}climatology"
          fi
          if [ "$CLIMATOLOGY_REACTIVE" = "1" ]; then
            arms="${arms:+$arms+}reactive"
          fi
          # This one is NOT in meta.json -- it is serving-only, so the artifact
          # cannot describe it and the heading is the record.
          if [ "$SERVE_OUTLIER_GATED_ANCHOR" = "1" ]; then
            arms="${arms:+$arms+}gated_anchor"
          fi
          arm="${arms:-control}"
          # Re-tuned runs get their own label. A confirm run and a first read
          # carry the same flags and are NOT comparable to each other, so the
          # heading has to separate them.
          if [ "$FORCE_HP_SEARCH" = "1" ]; then arm="${arm}+hpsearch"; fi
          # The fold row cap is the one arm whose value matters, not just its
          # on/off state -- a q_hat at 600K and one at 1.2M are different reads,
          # so the number goes in the heading. `meta.json` carries it too, under
          # `cv_results[h].q_hat_trend.cv_max_train_rows`.
          if [ "$CV_MAX_TRAIN_ROWS" != "300000" ]; then
            arm="${arm}+cvrows${CV_MAX_TRAIN_ROWS}"
          fi
          {
            echo "## ${{ matrix.horizon }}d diagnostics — arm: \`${arm}\`"
            echo
            echo "\`TIER_LEAD_FEATURE=$TIER_LEAD_FEATURE\` "
            echo "\`CROSS_SECTIONAL_RANK=$CROSS_SECTIONAL_RANK\` "
            echo "\`NAIVE_INIT_SCORE=$NAIVE_INIT_SCORE\` "
            echo "\`LAMBDARANK=$LAMBDARANK\` "
            echo "\`LABEL_SMOOTHED_ANCHOR=$LABEL_SMOOTHED_ANCHOR\` "
            echo "\`CONFORMAL_SERVED_BASIS=$CONFORMAL_SERVED_BASIS\` "
            echo "\`SERVE_OUTLIER_GATED_ANCHOR=$SERVE_OUTLIER_GATED_ANCHOR\` "
            echo "\`FORCE_HP_SEARCH=$FORCE_HP_SEARCH\` "
            echo "\`CV_MAX_TRAIN_ROWS=$CV_MAX_TRAIN_ROWS\`"
            echo
            echo "Bar is \`naive_rank_ic\` on the same folds, not 50% and not a stored number."
            echo
            echo "**Read the \`CLEAN ANCHOR\` line, not the one above it.** The pooled"
            echo "rank IC divides the label by the raw anchor quote its own features are"
            echo "built from, worth 0.03-0.24 rank IC — more than any effect being"
            echo "measured here. The clean-anchor cohort is where that wedge is 1."
            echo
            echo "\`Expanding-window audit\` screens the band's over-coverage: the pooled"
            echo "\`q_hat\` is fitted across folds trained on 87K-300K rows against the"
            echo "shipped 1.2M budget. A negative rho with a pooled/last ratio above 1"
            echo "means the calibration inherits the early folds' weakness. \`n_train\` is"
            echo "monotone in fold index, so it cannot separate that from the market"
            echo "period — a null kills the hypothesis, a negative only promotes it."
            echo
            echo "\`Sigma-tilt audit\` is the confirm read for the band's coverage, and"
            echo "**the held-out leg is the only part of it that can fail** — the pooled"
            echo "legs fit and score the exponent on the same rows. Offline, model-free,"
            echo "the elasticity is **0.408 / 0.401 / 0.363 / 0.327** at 3/7/14/30d"
            echo "against the **1.000** conformal assumes; the earlier prod read, on a"
            echo "\`sigma\` reconstructed as \`half_pct / q_hat\`, said **0.798 / 0.692 /"
            echo "1.034 / 1.150**. Those disagree by 3x and this run is the tiebreak."
            echo "Below 1 means \`sigma\` over-corrects and the LOW deciles are the"
            echo "under-covered ones. Reported only — the exponent is not implemented."
            echo '```'
            # `Cross-sectional` is matched explicitly: the log line reads
            # `rank_ic=`, so the `rank IC` alternative below only ever caught the
            # WARNING form and the headline pair was missing whenever it was
            # positive -- i.e. exactly when an arm had worked.
            #
            # `Conformal calibration` and the two expanding-window lines were
            # missing entirely: every note that says to "read q_hat off the
            # Conformal calibration line" meant downloading the log artifact,
            # because this grep never matched it. The band's width is the subject
            # of the open 2026-08-12 question, so it belongs in the summary.
            grep -E "classifier_acc|mean_dir_acc|CV summary|Pesaran|Cross-sectional|rank IC|Conformal calibration|Expanding-window audit|fold_q_hat|Sigma-tilt audit|\[timing\]" \
              diagnostics-${{ matrix.horizon }}d.log || echo "no diagnostic lines found"
            echo '```'
            # The serving-path read, when one was asked for. One anchor is one
            # date: a path check with a number attached, not an accuracy result.
            if [ -f replay-${{ matrix.horizon }}d.log ]; then
              echo
              echo "### Serving replay — ${{ inputs.replay_anchors }}"
              echo
              echo "Compare against a control dispatch on the same commit and the"
              echo "same anchors. Never against a stored number."
              echo '```'
              # Four row shapes: the replay table (h then a number), the basis
              # sweep, the tied/deviating split and the dollar table (h then a
              # word). Every heading is matched too -- the dollar rows and the
              # basis sweep's split rows are the same shape, so dropping a
              # heading interleaves two tables into one unlabelled block.
              grep -E "SERVING REPLAY|LABEL BASIS SWEEP|DOLLAR ERROR|^ *h +(n|basis|subset)|^ *[0-9]+ +[0-9]|^ *[0-9]+ +[a-z_]+ " \
                replay-${{ matrix.horizon }}d.log || echo "no replay rows found"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
