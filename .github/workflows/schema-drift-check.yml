name: Schema Drift Check

# WHY THIS EXISTS: `Item.is_trainable` was added to the ORM and merged with no Alembic
# migration. Prod never got the column, the aggregator crashed on its first query, and
# the nightly chain skipped silently for days — review, tests, and merge all missed it.
# See docs/research/2026-08-19-deep-model-review.md §2.
#
# This job applies the migrations to a throwaway Postgres and diffs the result against
# `Base.metadata` (the same comparison `alembic revision --autogenerate` runs). A model
# column with no migration fails the build BEFORE merge, where the original defect slipped
# through. Runs on PRs and pushes to main — it is a pre-merge gate, not a nightly monitor.

on:
  pull_request:
    paths:
      - 'backend/database.py'
      - 'backend/migrations/**'
      - 'backend/scripts/check_schema_drift.py'
      - '.github/workflows/schema-drift-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/database.py'
      - 'backend/migrations/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  schema-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cs2
          POSTGRES_PASSWORD: cs2
          POSTGRES_DB: cs2_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cs2:cs2@localhost:5432/cs2_scratch
      ENVIRONMENT: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations to the scratch database
        working-directory: ./backend
        run: alembic upgrade head

      - name: Compare Base.metadata against the migrated schema
        working-directory: ./backend
        run: python scripts/check_schema_drift.py
