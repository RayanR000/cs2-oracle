name: Forecast Freshness Check

# WHY THIS EXISTS SEPARATELY FROM Price Forecast:
# `scripts/check_forecast_freshness.py` already runs as the last step of the
# Price Forecast job — but that step can only fire when the job runs. On a night
# the forecast job fails outright, or is skipped because the upstream Aggregator
# failed, no run happens and nothing checks freshness. That is exactly how
# item_forecasts accreted gaps (2026-07-30, 08-03, 08-08, 08-10, 08-12) while
# the badge showed no red run for those dates. This job is INDEPENDENT of the
# forecast chain: it runs on its own schedule and turns "no forecast landed
# today" into a red run + owner notification, regardless of whether the forecast
# job ran at all. See docs/research/2026-08-15-directional-accuracy-and-data-inventory.md
# (accumulation audit) and the collector-audit precedent in
# docs/changelog/2026-07-31-accuracy-work-closed.md.

on:
  # Noon UTC: the nightly chain (Aggregator ~23:00 UTC -> Price Forecast) lands
  # the day's forecast_date by ~00:20 UTC, so by noon a healthy system carries
  # today's forecast in both stores. A miss is therefore a same-day alarm.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      # The check reads the Parquet mirror as well as the DB, because api/routes
      # serves Parquet first — a DB row without a mirror row serves nothing.
      - name: Checkout price archive
        uses: actions/checkout@v7
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Link price-archive
        run: ln -s $PWD/archive/price-archive price-archive

      # Expect a forecast at least as fresh as YESTERDAY, not today. The nightly
      # chain lands the day's forecast_date at ~00:00-00:20 UTC, so an
      # expected=today check run in that window (or on an off-hours manual
      # dispatch) false-fails before the day's forecast exists. A one-day grace
      # removes that boundary while still catching a genuinely stalled pipeline:
      # this monitor is the backstop for a day on which NO forecast run happened
      # (multi-day stall), while per-run failures are already alarmed by each
      # workflow's own failure issue. Detection latency is at most one day.
      - name: Verify a forecast landed within the last day
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
        run: python scripts/check_forecast_freshness.py --expected-date "$(date -u -d yesterday +%F)"

