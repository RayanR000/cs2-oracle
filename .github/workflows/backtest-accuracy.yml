name: Backtest Accuracy

on:
  # Daily: evaluate live forecasts
  workflow_run:
    workflows: ["Price Forecast"]
    types: [completed]
  schedule:
    - cron: '0 8 * * 1-6'
  workflow_dispatch:
    inputs:
      type:
        description: 'Backtest type (forecast only)'
        required: false
        default: 'forecast'
        type: choice
        options:
          - forecast

defaults:
  run:
    shell: bash

permissions:
  contents: read # required by actions/checkout; without it the token is contents:none and checkout 404s

jobs:
  backtest:
    # Run on: manual trigger, chained from forecast, or standalone cron (08:00 UTC)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Checkout price archive
        uses: actions/checkout@v7
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Link price-archive
        run: ln -s $PWD/archive/price-archive price-archive

      - name: Run forecast backtest
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: |
          echo "Running forecast backtest..."
          # Without pipefail the step status is tee's, always 0, so this
          # workflow could not report failure for any reason. The other
          # workflows all set it before their `| tee`; this one did not.
          set -o pipefail
          python scripts/backtest_accuracy.py --type forecast 2>&1 | tee backtest.log

      # Shadow evidence reports (read-only). Horizons below the 20-date gate
      # exit 1 with INSUFFICIENT_EVIDENCE — the expected state for weeks, not
      # a failure — so this step never fails the job; read the uploaded
      # artifact, not the step status. No report here can promote anything:
      # there is no auto-promotion step by design.
      - name: Build candidate evidence reports
        if: always()
        continue-on-error: true
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: |
          set -o pipefail
          python scripts/centre_promotion_report.py --horizon all --json-out centre_promotion.json --markdown-out centre_promotion.md 2>&1 | tee centre_promotion.log
          python scripts/ranking_transfer_report.py --horizon all --json-out ranking_transfer.json --markdown-out ranking_transfer.md 2>&1 | tee ranking_transfer.log

      # The open gate on retiring the GBM: on served rows its CENTRE loses to
      # quoting the last price (docs/research/2026-08-25-gbm-retirement-decision.md),
      # but every horizon was 8-11 clean dates against MIN_FORECAST_DATES=20, so
      # the verdict is not quotable yet. `--gate` exits 1 while any horizon is
      # short and 0 when all four are ready, so the first backtest run after the
      # panel matures announces it here instead of waiting for someone to
      # remember a date -- which matters because the panel is frozen while the
      # workflows are paused, so there IS no date to remember.
      #
      # continue-on-error: an immature panel is the expected state for weeks and
      # must not fail the backtest. Read the step's status, not the job's.
      - name: Centre-vs-last-price maturity gate
        continue-on-error: true
        working-directory: ./backend
        run: |
          python scripts/archive/centre_vs_lastprice.py --gate 2>&1 | tee centre_gate.log

      # backtest_accuracy.py appends forecast_outcomes and prediction_accuracy to
      # the archive (scripts/backtest_accuracy.py:111,263), which lands in the
      # ephemeral archive/ checkout — so without this step every CI backtest's
      # resolved outcomes were discarded at teardown, and the accuracy history
      # only ever advanced when someone ran the backtest locally. Same gap that
      # price-forecast.yml had for item_forecasts.parquet.
      #
      # Mirrors "Publish updated archive" in aggregator-update.yml. Not
      # conditioned on success: resolution is incremental and frozen once
      # written, so outcomes resolved before a later failure are still worth
      # keeping — discarding them just means redoing the work next run.
      #
      # Ordering note: this force-pushes the whole tree, so it must not run
      # concurrently with another archive writer. It does not today — this
      # workflow is triggered by Price Forecast *completion* (after that
      # workflow's own publish step) or by the 08:00 cron, both disjoint from the
      # 23:00 aggregator. Adding a third writer would need that revisited.
      - name: Publish updated archive (flat history)
        if: always()
        working-directory: ./archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Lease on the checked-out SHA: a stale checkout fails the push instead of deleting
          # whatever landed since (09-19 was lost that way, changelog 2026-09-29).
          BASE=$(git rev-parse HEAD)
          git checkout --orphan flat
          git add -A
          git commit -m "archive: forecast outcomes + accuracy $(date -u +%F)"
          git push --force-with-lease=main:"$BASE" origin HEAD:main


      - name: Upload backtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-logs-${{ github.run_id }}
          path: |
            backend/backtest.log
            backend/centre_gate.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-reports-${{ github.run_id }}
          path: |
            backend/centre_promotion.json
            backend/centre_promotion.md
            backend/centre_promotion.log
            backend/ranking_transfer.json
            backend/ranking_transfer.md
            backend/ranking_transfer.log
          if-no-files-found: warn
          retention-days: 90
