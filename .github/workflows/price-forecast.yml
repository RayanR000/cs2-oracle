name: Price Forecast

on:
  # Chain off the aggregator update: once prices are written, run forecasts.
  # Previously chained off Daily Trend Analysis (removed Jul 2026 — ML
  # forecasts are now the sole signal source).
  workflow_run:
    workflows: ["Aggregator Market Update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Forecast mode'
        required: true
        default: 'predict-only'
        type: choice
        options:
          - predict-only
          - train-only
          - full

defaults:
  run:
    shell: bash

permissions:
  # Was write for the model-commit push, which no longer happens.
  contents: read

jobs:
  forecast:
    # Skip when the upstream aggregator failed — forecasts need fresh prices.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # arm64, not ubuntu-latest. Free on public repos and materially faster on
    # this workload, which is LightGBM-bound. Every binary dependency ships an
    # aarch64 manylinux wheel (lightgbm as py3-none-manylinux2014_aarch64, the
    # rest as cp311), so nothing builds from source.
    #
    # Consequence to know before comparing runs: floating point differs from
    # x86, so an artifact trained here is not bit-identical to one trained on
    # ubuntu-latest, and a timing or accuracy delta measured ACROSS the switch
    # confounds architecture with whatever else changed. Compare within an
    # architecture. The x86 baseline is run 31405829674.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Checkout price archive
        uses: actions/checkout@v7
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Link price-archive
        run: ln -s $PWD/archive/price-archive price-archive

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "1" ]; then
            # Monday: full retrain + predict
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=predict-only" >> $GITHUB_OUTPUT
          fi

      # Boosters are gitignored (.gitignore:68-71), so they cannot be persisted
      # by committing them — that silently no-op'd and left predict-only runs
      # with a meta.json and no models from 2026-07-14 to 2026-07-31. They ride
      # the Actions cache instead. engineered_data.parquet is excluded: it is a
      # ~2GB predict-path feature cache, too big for the 10GB Actions budget.
      #
      # Restored on EVERY mode, not just predict-only. Training modes want the
      # *hyperparameters* out of this same artifact: `tuned_params` is populated
      # only by the meta.json load path (forecaster.py:6632-6645), so with an
      # empty saved_models/ the `reuse_hp` check at :4059 can never be true and
      # Optuna re-searches from scratch. That cost 692.9s of run 31356483719's
      # 2306.0s. See docs/research/2026-08-10-training-cost-levers.md.
      - name: Restore trained models
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/models/saved_models
            !backend/models/saved_models/engineered_data.parquet
          key: forecast-models-${{ github.run_id }}
          restore-keys: |
            forecast-models-

      # The voted price frame (backend/data/voted_*.parquet, gitignored). Worth
      # ~48s a run — 21.1s DuckDB read + 27.2s multi-source voting — on the
      # daily predict path as well as the retrain. Until 2026-08-09 the key
      # embedded each archive file's st_mtime_ns, and CI checks the archive out
      # fresh every run, so the key changed unconditionally and this could
      # never have hit; _archive_fingerprint is content-derived now.
      #
      # Bumped from v6 to v7 to match ItemForecaster.VOTED_CACHE_VERSION (v7
      # excluded STEAM_SPOT_SOURCES). The version is hashed into the frame's
      # own filename by _voted_cache_key/_voted_cache_path, so a v7 reader
      # never finds a v6 file and recomputes — the lagging key meant the cache
      # could never hit. One cold run after this bump, then every subsequent
      # run saves ~48s (21.1s DuckDB read + 27.2s multi-source voting).
      - name: Cache voted price frame
        uses: actions/cache@v4
        with:
          path: backend/data
          key: voted-v7-${{ hashFiles('backend/models/forecaster.py') }}
          restore-keys: voted-v7-

      # Fail loudly here rather than 60s later with the opaque "No models
      # available for prediction" that hid this breakage for 17 days.
      - name: Verify models are present
        if: steps.mode.outputs.mode == 'predict-only'
        run: |
          n=$(ls backend/models/saved_models/*.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "Restored $n booster files."
          if [ "$n" -eq 0 ]; then
            echo "::error::No boosters restored from the Actions cache. The" \
                 "weekly retrain has not populated it yet, or the entry was" \
                 "evicted. Re-run this workflow via workflow_dispatch with" \
                 "mode=full to retrain and repopulate the cache."
            exit 1
          fi

      - name: Run ML price forecasting
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
          # SKIP_CV is deliberately NOT set. The conformal band's q_hat is
          # fitted on the out-of-fold CV records; skipping CV routes it to the
          # single holdout, which is also the early-stopping and Optuna scoring
          # set, so q_hat comes out biased low and the served band under-covers.
          # Do not re-add it to buy CI minutes.
          # Pinned by backend/tests/test_minimal_model_shape.py.
          #
          # The per-fold directional classifier inside CV is a DIAGNOSTIC: only
          # the quantile-median predictions reach `oof_records`, so q_hat and
          # the confidence thresholds never see it, and no served artifact
          # depends on it. It costs 32-37% of a retrain (3 trees per boosting
          # round against the median model's 1). Skipping it here drops
          # `mean_classifier_acc*` from meta.json and nothing else; the
          # invariant-#4 metrics (constant call, down rate, Pesaran-Timmermann)
          # and the cross-sectional rank IC are built from the median sign and
          # still run. Local and research retrains keep the default (on).
          #
          # "32-37%" above was benchmarked under early stopping, which collapsed
          # the classifier to ~3 trees. Re-measured 2026-08-09 under fixed rounds
          # it is 52% of a classifier-on retrain (1804s -> 872s locally).
          # See docs/research/2026-08-08-model-review.md.
          CV_DIAGNOSTIC_CLASSIFIER: "0"
          # The ~2GB engineered feature cache is excluded from the restore above
          # and from the save below, so in CI it is written once and never read.
          # Local runs keep it (it is a real predict-path speedup there).
          ENGINEERED_CACHE: "0"
          # Regime models are not trained, so `predict` falls back to the global
          # model for every item. This IS a change to the served mid, not a cost
          # saving — forecaster.py:5658 prefers the regime model whenever
          # _detect_current_regime matches, which on this artifact is always
          # (`range` is the only trained regime and it covers 818K-893K of ~985K
          # rows, so the "specialist" branch was serving ~90% of the cohort).
          #
          # Two reasons to drop them. The deployed set has included 1-tree and
          # 3-tree boosters, so it is plausibly degrading the mid it displaces
          # (docs/research/2026-08-08-model-review.md item 7). And the served
          # model currently depends on where it was trained: CI trained regimes
          # while the documented local retrain passes SKIP_REGIMES=1, so the
          # artifact differed by runner. This makes the two paths agree.
          #
          # Worth ~183s of a ~1120s warm retrain. Revert by removing this line;
          # nothing else is coupled to it since 2026-08-10 decoupled regime
          # training from the warm-retrain gate.
          SKIP_REGIMES: "1"
          # REQUIRED now that the model cache is restored on every mode. `full`
          # reaches the age gate at forecast_prices.py:390-402, which retrains on
          # model age only (14d). Monday's weekly retrain runs 7 days after the
          # last one, so a restored artifact would read as fresh and `full` would
          # silently degrade into a predict-only run — the failure mode recorded
          # in docs/changelog/2026-08-10-post-revote-retrain.md, which is why
          # that retrain had to be dispatched as train-only. Ignored by the other
          # two modes: train-only sets do_train unconditionally, and predict-only
          # never reads force_retrain.
          FORCE_RETRAIN: ${{ steps.mode.outputs.mode == 'full' && '1' || '0' }}
          # Train + serve the exceedance head: P(the h-day upside move clears the
          # round-trip cost), disclosed per item as item_forecasts.exceed_p
          # (migration 0024). DECOUPLED from the band scale — the band stays on
          # the winning CLIMATOLOGY_SCALE; this only adds ~4 boosters (~65s) and
          # emits the probability. Off would mean no head and a NULL exceed_p.
          # Pre-flip reliability validated on replay at 3 anchors (h3 ECE <1pp,
          # h7 <2pp on 2/3; the outlier was a directional date, not miscalibration)
          # — docs/changelog/2026-08-20-exceedance-served-signal.md. Inert in
          # predict-only; the head appears at the next full / train-only retrain.
          EXCEEDANCE_HEAD: "1"
          # Feed NaN features to LightGBM's native handling instead of filling
          # them with the training cross-sectional median. The long-return medians
          # are strongly positive, so median-impute handed short-history /
          # newly-eligible backfill items a multi-month uptrend they never had
          # (deep-review §10.4). Correctness fix: paired retrain + CI dispatch
          # (control 32450733074 vs arm 32450742482) show coverage/width identical
          # (≤0.2pp / ≤0.06%), DA a whisker higher in 5/6 cells, centre flat — no
          # regression. Off = byte-identical median impute. Builds at the next
          # full / train-only retrain — docs/changelog/2026-08-21-feature-native-nan-built-gated-off.md.
          FEATURE_NATIVE_NAN: "1"
          # Persist what was actually QUOTED. The served `current_price` cannot
          # be reconstructed afterwards -- six candidate rebuilds off today's
          # voted frame each match the stored quote on at most 11.7% of rows --
          # while the serving path's own smoothing agrees with the backtest
          # resolver EXACTLY (5,536 of 5,536 items, p90 diff 0.00000) when both
          # read the same archive. So the ~85% / median 5.70% disagreement
          # between the served quote and the scored base is the DATA moving
          # between serve time and scoring time, not arithmetic, and it is what
          # drives published dollar coverage down to 54-72% against a band
          # calibrated to 80%.
          #
          # This writes raw quote + smoothed value per item per anchor into
          # price-archive/ops/anchor_audit/, so the publish step below carries
          # it and every future wedge is attributable. ~5,500 rows a day. It
          # cannot fail a run: the audit swallows its own exceptions.
          # docs/changelog/2026-08-25-centre-shrinks-to-zero-and-the-dollar-band-is-the-wedge.md
          ANCHOR_AUDIT: "1"
          # EXCEEDANCE_META REMOVED 2026-09-09 — measured and REFUTED, and it
          # was harmful, not merely null. Paired over 25-26 walk-forward folds
          # per horizon (scripts/exceedance_meta_ab.py): held-out log loss is
          # WORSE at all four horizons (significant at 7/14/30d, up to +0.014 at
          # 30d) and held-out AUC is significantly NEGATIVE at 7d (-0.029, better
          # in only 8 of 26 folds). The trained-cohort gains are memorisation
          # through type_meta_crate_id / type_meta_collection_id (~110-300 levels
          # over ~870 items) — a permuted placebo is null in all 16 cells, and a
          # static_only arm without the ID columns is null out of sample. The
          # same nine columns were already refuted against the centre on
          # 2026-08-06. Do not re-add without a NEW column family.
          # docs/changelog/2026-09-09-exceedance-meta-refuted.md
          #
          # Anomaly/regime GBM: P(|return_h| > 2σ_item). Served as anomaly_p
          # in the API — an alert flag, not a band input. Builds at retrain.
          # MEASURED 2026-09-09 and it holds up: held-out AUC +0.139/+0.153/
          # +0.128/+0.129 over a featureless null at 3/7/14/30d, every interval
          # clear of zero, log loss better at 3/7/14d and a tie at 30d — the
          # first GBM here to beat a featureless rule. The label's 2σ threshold
          # was rebuilt the same day to use the strictly-prior return_{h}d
          # instead of trailing target_return_{h}d, which resolved h days after
          # its own row; the AUC survives the fix unchanged to slightly better.
          # docs/changelog/2026-09-09-anomaly-head-beats-its-null.md
          ANOMALY_GBM: "1"
          # Per-item shrinkage K: GATED OFF 2026-09-10, pending measurement.
          # SHRINK_K_GBM=1 shipped in 4949714 with no paired replay behind it,
          # and the 02:59 UTC 2026-09-09 retrain baked its per-item K table into
          # the live artifact — an unvalidated GBM in the served band geometry
          # while VOLATILITY_RANK_GBM (which at least has a local A/B claim)
          # sits off. The validated state is the flat CLIMATOLOGY_SHRINK_K=320
          # (f02320b: narrower in 23/23 served-gated paired cells). Re-arm only
          # behind backend/scripts/shrink_k_vol_rank_ab.py winning paired at
          # matched 80% coverage — see
          # docs/changelog/2026-09-10-shrink-k-gated-off-vol-rank-unwired.md.
          # Takes effect at the next full / train-only retrain (predict-only
          # serves whatever K the artifact's table was built with).
          SHRINK_K_GBM: "0"
          # MSE ("regression") beats quantile (MAE) at 30d centre by +0.041
          # rank IC (significant) in scripts/objective_comparison_ab.py.
          # Unmentioned horizons keep quantile. Drop-in: the objective swap
          # does not touch conformal or the band path.
          CENTRE_OBJECTIVE: "30:regression"
          # LambdaRank sidecar: beats q50 ordering on the clean-anchor
          # cohort at all 4 horizons (+0.026 to +0.065 tied rank IC).
          # Outputs a ranking score, not a return — served as rank_score
          # alongside the forecast, never drives the conformal band.
          # ~4 boosters, modest cost. Builds at the next retrain.
          RANKING_HEAD: "1"
        run: |
          echo "🔮 Mode: ${{ steps.mode.outputs.mode }}"
          set -o pipefail
          case "${{ steps.mode.outputs.mode }}" in
            predict-only)
              python scripts/forecast_prices.py --predict-only 2>&1 | tee forecast.log
              ;;
            train-only)
              python scripts/forecast_prices.py --train-only 2>&1 | tee forecast.log
              ;;
            full)
              python scripts/forecast_prices.py 2>&1 | tee forecast.log
              ;;
          esac

      - name: Run drift detection
        if: steps.mode.outputs.mode == 'predict-only'
        working-directory: backend
        run: |
          python -m scripts.run_drift_check --output-dir data/drift_reports
        env:
          DRIFT_REPORT_DIR: data/drift_reports
        continue-on-error: true

      # forecast_prices.py writes the item_forecasts Parquet mirror into the
      # ephemeral archive/ checkout, so without this step every CI run's mirror
      # write is discarded at teardown. That is why item_forecasts.parquet
      # stopped at 2026-07-29 — the last manual local run — while Supabase kept
      # advancing, and why the API (which reads Parquet first, falling back to
      # the DB only on None/exception) served forecasts days older than the DB
      # held.
      #
      # Mirrors "Publish updated archive" in aggregator-update.yml: the parquet
      # files ARE the data, each holding full history, so git history of them has
      # no value and only bloats the repo — republish as one squashed commit via
      # an orphan branch + force-push. Safe because the chain is sequential
      # (aggregator 23:00 -> this -> backtest) and each job checks out the
      # archive fresh, so the orphan tree is never missing another job's write.
      #
      # MUST run before the freshness check below. Reversed, the check would read
      # the file this step is about to publish and pass on state that does not
      # survive the job — which is exactly the false green it exists to prevent.
      - name: Publish updated archive (flat history)
        if: always() && steps.mode.outputs.mode != 'train-only'
        working-directory: ./archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Lease on the checked-out SHA: a stale checkout fails the push instead of deleting
          # whatever landed since (09-19 was lost that way, changelog 2026-09-29).
          BASE=$(git rev-parse HEAD)
          git checkout --orphan flat
          git add -A
          git commit -m "archive: item_forecasts $(date -u +%F)"
          git push --force-with-lease=main:"$BASE" origin HEAD:main

      # A run that persists nothing must not report success. item_forecasts
      # accumulated 5 forecast dates in eight months because nothing asserted
      # the output — the same shape as the collectors audited in
      # docs/changelog/2026-07-31-accuracy-work-closed.md. Skipped for
      # train-only, which is not expected to write forecasts.
      - name: Verify forecasts were persisted
        if: always() && steps.mode.outputs.mode != 'train-only'
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
        run: python scripts/check_forecast_freshness.py

      # Deliberately NOT conditioned on success. Training finishes and writes
      # valid boosters to disk minutes before the predict phase OOMs (exit 143 —
      # see runs 30226424193, 29793571744, 30666903525, all killed at "Adding
      # item identity features"). Discarding those boosters because a later
      # phase died is what leaves the cache permanently empty, so every
      # predict-only run then aborts on "No models available" and the predict
      # OOM is never even reached. Save whatever training produced.
      - name: Check for boosters to save
        if: always() && (steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'train-only')
        id: boosters
        run: |
          n=$(ls backend/models/saved_models/*.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> $GITHUB_OUTPUT
          echo "Training left $n booster files on disk."

      # run_id keys are unique, so this never collides; predict-only runs pick
      # the newest via the forecast-models- restore-key prefix. Daily restores
      # keep the entry warm against the 7-day eviction window.
      - name: Save retrained models
        if: always() && steps.boosters.outputs.count != '0' && steps.boosters.outputs.count != ''
        uses: actions/cache/save@v4
        with:
          path: |
            backend/models/saved_models
            !backend/models/saved_models/engineered_data.parquet
          key: forecast-models-${{ github.run_id }}


      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-logs-${{ github.run_id }}
          path: backend/forecast.log
          retention-days: 30
