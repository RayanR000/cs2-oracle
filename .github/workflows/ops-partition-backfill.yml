name: Ops Partition Backfill

# One-off, Phase 1 step 1 of docs/specs/2026-10-11-postgres-to-parquet-history-design.md:
# seed ops/<table>/YYYY-MM.parquet and ops/items.parquet in cs2-oracle-data from the
# 2026-10-11 Supabase backup (release supabase-backup-2026-10-11) merged with the
# single-file mirror, which it reads and never writes. Refuses if a target exists, so a
# second run is a no-op failure, not a rewrite. Dry run unless `apply` is ticked.
# Dispatch between Backtest Accuracy finishing and the 23:00 UTC Aggregator; the push
# lease fails it rather than lose a concurrent write.
# See docs/changelog/2026-10-11-ops-partition-backfill.md.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write and publish (unticked = dry run)
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read # the data repo is written via CS2_DATA_REPO_TOKEN

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Checkout price archive
        uses: actions/checkout@v7
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Fetch and verify the backup
        env:
          GH_TOKEN: ${{ secrets.CS2_DATA_REPO_TOKEN }}
        run: |
          gh release download supabase-backup-2026-10-11 -R RayanR000/cs2-oracle-data -D "$RUNNER_TEMP/backup"
          cd "$RUNNER_TEMP/backup" && sha256sum -c SHA256SUMS

      - name: Backfill
        working-directory: ./backend
        run: |
          python -m scripts.backfill_ops_partitions \
            --backup-dir "$RUNNER_TEMP/backup" --archive-dir ../archive/price-archive \
            ${{ inputs.apply && '--apply' || '' }}

      - name: Publish updated archive (flat history)
        if: inputs.apply
        working-directory: ./archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Lease on the checked-out SHA: a stale checkout fails the push instead of deleting
          # whatever landed since (09-19 was lost that way, changelog 2026-09-29).
          BASE=$(git rev-parse HEAD)
          git checkout --orphan flat
          git add -A
          git commit -m "archive: seed ops partitions from the 2026-10-11 backup"
          git push --force-with-lease=main:"$BASE" origin HEAD:main
