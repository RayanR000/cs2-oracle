name: Aggregator Market Update

on:
  schedule:
    # Once daily at 23:00 UTC (7:00 PM EDT). CSGOTrader regenerates its price
    # dumps once a day around ~21:40 UTC (verified via Last-Modified headers
    # and 5 weeks of collected data — extra same-day runs always returned
    # identical prices). 23:00 leaves buffer for upstream drift and Actions
    # cron delay, keeps timestamps on the same calendar day as the prices,
    # and leaves time for the forecast chain (runs ~01:00 UTC).
    - cron: '0 23 * * *'
  workflow_dispatch: # Allow manual trigger

defaults:
  run:
    shell: bash

permissions:
  issues: write
  contents: read # archive now lives in the cs2-oracle-data repo (pushed via CS2_DATA_REPO_TOKEN)

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Database Migration
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: python scripts/run_task.py migrate

      - name: Run Aggregator Task
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: |
          echo "🚀 Starting aggregator market update..."
          set -o pipefail
          python scripts/run_task.py aggregate 2>&1 | tee aggregator.log

      # Snapshot-tier items keep only their latest row in Supabase, so each
      # day's collection is dumped to the cs2-oracle-data repo as the durable
      # record of their price history.
      - name: Checkout data archive
        uses: actions/checkout@v4
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Append to Parquet archive
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: >
          python scripts/append_to_parquet.py
          --date $(date -u +%F)
          --out-dir ../archive
          --snapshot-csv /tmp/aggregator-snapshots-$(date -u +%F).csv
          --backfilled-csv /tmp/aggregator-backfilled-$(date -u +%F).csv
          --exchange-rates-csv /tmp/exchange-rates-$(date -u +%F).csv

      # The parquet files ARE the data (each holds full history), so git history
      # of them has no value and only bloats the repo. Republish the archive as a
      # single squashed commit each run via an orphan branch + force-push.
      - name: Publish updated archive (flat history)
        working-directory: ./archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan flat
          git add -A
          git commit -m "archive: prices + exchange-rates $(date -u +%F)"
          git push --force origin HEAD:main

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[${{ github.workflow }}] Failed - $(date +%F)" \
            --body "Workflow **${{ github.workflow }}** failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Branch: ${{ github.ref_name }}
          Trigger: ${{ github.event_name }}" \
            --label "automation" 2>/dev/null || true

      - name: Upload aggregator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregator-logs-${{ github.run_id }}
          path: backend/aggregator.log
          retention-days: 30
