name: Aggregator Market Update

on:
  schedule:
    # Once daily at 23:00 UTC (7:00 PM EDT). CSGOTrader regenerates its price
    # dumps once a day around ~21:40 UTC (verified via Last-Modified headers
    # and 5 weeks of collected data — extra same-day runs always returned
    # identical prices). 23:00 leaves buffer for upstream drift and Actions
    # cron delay, keeps timestamps on the same calendar day as the prices,
    # and leaves time for the forecast chain (runs ~01:00 UTC).
    - cron: '0 23 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      compact_archive:
        description: >
          One-time: drop the redundant median/min/max price columns and delete
          snapshots-*.parquet from the data repo before appending. Idempotent —
          safe to leave off, safe to re-run. See
          docs/changelog/2026-08-06-price-archive-compaction.md
        type: boolean
        default: false
      normalize_schema:
        description: >
          One-time: give every prices-*.parquet the same schema — materialise
          `source` on the pre-2026 files, cast `day` to DATE, canonical column
          order. Fixes a plain glob read silently dropping `source`. Idempotent
          — safe to leave off, safe to re-run. See
          docs/changelog/2026-08-07-archive-schema-and-keys.md
        type: boolean
        default: false
      backfill_ops_slug:
        description: >
          One-time: stamp item_slug onto the existing ops/*.parquet rows so a
          forecast can be joined to its price history without Supabase. New
          rows already carry it. Idempotent. Needs SUPABASE_DATABASE_URL.
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read # archive now lives in the cs2-oracle-data repo (pushed via CS2_DATA_REPO_TOKEN)

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Database Migration
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: python scripts/run_task.py migrate

      # Resolved ONCE, here, and reused by every step below. Previously the
      # pipeline stamped filenames from its own datetime.utcnow() and this
      # workflow passed `--date $(date -u +%F)` from a separate clock read a step
      # later, so a run straddling midnight would look for a file the pipeline
      # had named for the previous day. The cron fires at 23:00 and Actions
      # delay was observed pushing starts to 00:08, which also silently lost
      # 2026-07-27, 2026-07-30 and 2026-08-03 from the archive entirely.
      # See backend/collectors/snapshot_date.py.
      - name: Resolve snapshot date
        working-directory: ./backend
        run: |
          SNAPSHOT_DATE=$(python -c 'from collectors.snapshot_date import resolve_snapshot_date; print(resolve_snapshot_date())')
          echo "Snapshot day resolved to $SNAPSHOT_DATE (runner clock: $(date -u +%FT%TZ))"
          echo "SNAPSHOT_DATE=$SNAPSHOT_DATE" >> "$GITHUB_ENV"

      - name: Run Aggregator Task
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
          # Pins the pipeline to the same day the append step will use.
          AGGREGATOR_SNAPSHOT_DATE: ${{ env.SNAPSHOT_DATE }}
        run: |
          echo "🚀 Starting aggregator market update..."
          set -o pipefail
          python scripts/run_task.py aggregate 2>&1 | tee aggregator.log

      # Snapshot-tier items keep only their latest row in Supabase, so each
      # day's collection is dumped to the cs2-oracle-data repo as the durable
      # record of their price history.
      - name: Checkout data archive
        uses: actions/checkout@v7
        with:
          repository: RayanR000/cs2-oracle-data
          ref: main
          token: ${{ secrets.CS2_DATA_REPO_TOKEN }}
          path: archive
          fetch-depth: 1

      # Runs BEFORE the append so the day's rows land on the already-compacted
      # schema. The other order also works, but leaves the new rows carrying
      # NULL median/min/max until the compaction strips those columns.
      - name: Compact the price archive (one-time, manual)
        if: inputs.compact_archive
        working-directory: ./backend
        run: >
          python scripts/compact_price_archive.py
          --archive-dir ../archive/price-archive
          --apply

      # After compaction (which drops columns) and before the append, so the
      # day's rows land on the canonical schema rather than being written and
      # then rewritten. append_to_parquet.py already emits this shape, so a
      # normalized archive stays normalized without this step running again.
      - name: Normalize the price schema (one-time, manual)
        if: inputs.normalize_schema
        working-directory: ./backend
        run: >
          python scripts/normalize_price_schema.py
          --archive-dir ../archive/price-archive
          --apply

      - name: Backfill item_slug on the ops tables (one-time, manual)
        if: inputs.backfill_ops_slug
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: >
          python scripts/backfill_ops_item_slug.py
          --archive-dir ../archive/price-archive
          --apply

      - name: Append to Parquet archive
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: >
          python scripts/append_to_parquet.py
          --date "$SNAPSHOT_DATE"
          --out-dir ../archive
          --snapshot-csv /tmp/aggregator-snapshots-$SNAPSHOT_DATE.csv
          --backfilled-csv /tmp/aggregator-backfilled-$SNAPSHOT_DATE.csv
          --exchange-rates-csv /tmp/exchange-rates-$SNAPSHOT_DATE.csv

      # Runs INSIDE this workflow, between the append and the publish, so the
      # day's supply snapshot lands in the same orphan commit as the day's
      # prices. That placement is the whole point: the previous supply table was
      # written only to Postgres and a local Parquet, was never published to the
      # data repo, and its single surviving day was invisible to anything that
      # reads the archive.
      #
      # `continue-on-error` because Price Forecast and Backtest Accuracy chain
      # off THIS workflow's success. Supply depth is an unproven experiment; a
      # marketplace outage must not take down the daily forecast. The collector
      # already exits non-zero only when EVERY feed fails, so this suppresses a
      # total outage, not a partial one -- and the JSON summary in the log
      # carries per-feed counts either way.
      #
      # AGGREGATOR_SNAPSHOT_DATE pins the same day label the price rows got, so
      # the two join. Without it a run straddling midnight labels supply D+1
      # against prices D.
      # Supply depth (~7min) and sales volume (~2s) are independent collectors
      # hitting different endpoints (lis-skins vs Skinport). Run them in parallel
      # so the ~2s volume call doesn't wait behind the ~7min depth call.
      #
      # `continue-on-error` because Price Forecast and Backtest Accuracy chain
      # off THIS workflow's success. Supply depth is an unproven experiment; a
      # marketplace outage must not take down the daily forecast. Sales volume is
      # the pipeline's ONLY real trade-volume feed (no aggregator feed carries a
      # volume field, probed 2026-08-08). Skinport answers 403 to Cloudflare-owned
      # egress (AS13335), so this can pass from CI and fail from a laptop on WARP.
      - name: Collect supply depth + sales volume (parallel)
        continue-on-error: true
        working-directory: ./backend
        env:
          AGGREGATOR_SNAPSHOT_DATE: ${{ env.SNAPSHOT_DATE }}
        run: |
          echo "📦 Collecting supply depth (scalar feeds ~2s, lis-skins ladder ~7min)..."
          python scripts/run_supply_depth.py --archive-dir ../archive/price-archive &
          PID_SUPPLY=$!
          echo "📊 Collecting completed-sale volume (Skinport, 1 call ~2s)..."
          python scripts/run_sales_volume.py --archive-dir ../archive/price-archive &
          PID_VOLUME=$!
          FAIL=0
          wait $PID_SUPPLY || { echo "::warning::Supply depth collection failed"; FAIL=1; }
          wait $PID_VOLUME || { echo "::warning::Sales volume collection failed"; FAIL=1; }
          exit $FAIL

      # The parquet files ARE the data (each holds full history), so git history
      # of them has no value and only bloats the repo. Republish the archive as a
      # single squashed commit each run via an orphan branch + force-push.
      - name: Publish updated archive (flat history)
        working-directory: ./archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan flat
          git add -A
          git commit -m "archive: prices + exchange-rates $SNAPSHOT_DATE"
          git push --force origin HEAD:main


      - name: Upload aggregator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregator-logs-${{ github.run_id }}
          path: backend/aggregator.log
          retention-days: 30
