name: Discover New Items

on:
  # Superseded 2026-09-30: the Aggregator adds new releases itself
  # (backend/collectors/new_item_discovery.py) from the price dumps it already
  # downloads. The CSMarketAPI backfill that used to add them is gone. This
  # workflow stays a stub; see docs/changelog/2026-09-30-serve-new-releases-at-h3.md.
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Discover new Steam items
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: |
          echo "Discovery is disabled: scripts/discover_steam_items.py was removed"
          echo "2026-09-15 (codebase cleanup). New releases are added by the"
          echo "Aggregator (backend/collectors/new_item_discovery.py) since 2026-09-30."
          exit 1


      - name: Upload discovery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-logs-${{ github.run_id }}
          path: backend/discovery.log
          retention-days: 30
