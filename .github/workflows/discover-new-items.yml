name: Discover New Items

on:
  # Schedule disabled 2026-07-08: the catalog intentionally contains only
  # backfilled items; new items are added by the monthly CSMarketAPI
  # backfill runs, not by Steam discovery. Manual trigger kept for one-offs.
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Discover new Steam items
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: false
        run: |
          echo "Discovery is disabled: scripts/discover_steam_items.py was removed"
          echo "2026-09-15 (codebase cleanup — it imported the long-deleted"
          echo "collectors.real_data_collector). New items arrive via the monthly"
          echo "CSMarketAPI backfill, not Steam discovery."
          exit 1


      - name: Upload discovery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-logs-${{ github.run_id }}
          path: backend/discovery.log
          retention-days: 30
