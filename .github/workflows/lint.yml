name: Lint & Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Ruff lint (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'backend/**.py' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            echo "Linting: $FILES"
            ruff check $FILES
          else
            echo "No Python files changed."
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Import smoke test
        working-directory: ./backend
        run: |
          python -c "
          import config
          import database
          import api
          import models.forecaster
          import models.conformal
          import models.item_parser
          import collectors.snapshot_date
          print('All key modules import successfully.')
          "

      - name: Fast test gate (not slow)
        # Full suite is ~12 min; the `slow` mark (real trainers / full frames,
        # see docs/changelog/2026-09-15-ci-test-gate.md) keeps the PR gate in
        # budget. Collection runs first inside pytest — an unimportable test
        # module fails this step, which is what caught the 2026-09 red main.
        # Env guard: tests must never touch prod. backend/.env points at the
        # production Supabase pooler, so pin a throwaway sqlite DB here —
        # anything that needs a live DB then fails loudly instead of writing.
        # faulthandler_timeout: the gate runs in ~1 min, but it has hung
        # intermittently on CI until the job timeout, and a cancelled job keeps
        # no log. Any single test past 120s now dumps every thread's stack.
        # -n 4 with OMP_NUM_THREADS=1: four xdist workers, one BLAS/LightGBM
        # thread each, so they do not oversubscribe the runner's cores. The
        # gate's sqlite file is never written, so workers can share it.
        env:
          DATABASE_URL: sqlite:////tmp/ci-gate.db
          ENVIRONMENT: test
          OMP_NUM_THREADS: '1'
        run: |
          pytest backend/tests -m "not slow" -q -n 4 -o faulthandler_timeout=120

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Type check (mypy, models + backtest)
        # Gradual adoption: clean modules gate; still-dirty ones are listed in
        # [tool.mypy] overrides until fixed (see docs/changelog/2026-09-15-mypy-baseline.md).
        working-directory: ./backend
        run: |
          mypy models backtest
